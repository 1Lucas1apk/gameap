<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameAP</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <script>
        // Load theme from localStorage and apply it immediately (defaults to Graphite dark)
        (function() {
            let theme = 'dark';
            try {
                const settings = localStorage.getItem('gameap_ui_settings');
                if (settings) {
                    const parsed = JSON.parse(settings);
                    theme = parsed.theme || 'dark';
                } else {
                    const oldTheme = localStorage.getItem('gameap_theme');
                    if (oldTheme) {
                        theme = oldTheme;
                        localStorage.setItem('gameap_ui_settings', JSON.stringify({ theme: oldTheme }));
                        localStorage.removeItem('gameap_theme');
                    }
                }
            } catch (e) {
                console.error('Failed to load theme from localStorage:', e);
            }
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(theme);
        })();

        // Load i18n translations synchronously before app loads
        (function() {
            // Detect language from HTML lang attribute, localStorage, or browser default
            function detectLanguage() {
                // 1. Check localStorage gameap_ui_settings for saved preference
                try {
                    const settings = localStorage.getItem('gameap_ui_settings');
                    if (settings) {
                        const parsed = JSON.parse(settings);
                        if (parsed.language) {
                            return parsed.language;
                        }
                    } else {
                        const oldLang = localStorage.getItem('gameap_lang');
                        if (oldLang) {
                            return oldLang;
                        }
                    }
                } catch (e) {
                    console.error('Failed to load language from localStorage:', e);
                }

                // 2. Check admin default from server config
                try {
                    const configXhr = new XMLHttpRequest();
                    configXhr.open('GET', '/api/config/public', false);
                    configXhr.send();
                    if (configXhr.status === 200) {
                        const config = JSON.parse(configXhr.responseText);
                        if (config.default_language) {
                            return config.default_language;
                        }
                    }
                } catch (e) {
                    console.error('Failed to load default language from config:', e);
                }

                // 3. Check browser language
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang) {
                    // Extract language code (e.g., 'en' from 'en-US')
                    return browserLang.split('-')[0].toLowerCase();
                }

                // 4. Check HTML lang attribute
                const htmlLang = document.documentElement.lang;
                if (htmlLang) {
                    return htmlLang;
                }

                // 5. Default to English
                return 'en';
            }

            // Load the list of available languages from the backend so the set
            // of locales is not hardcoded here.
            let languages = [];
            try {
                const langsXhr = new XMLHttpRequest();
                langsXhr.open('GET', '/lang', false);
                langsXhr.send();
                if (langsXhr.status === 200) {
                    languages = JSON.parse(langsXhr.responseText);
                }
            } catch (e) {
                console.error('[i18n] Failed to load language list:', e);
            }
            window.gameapLanguages = languages;

            const availableCodes = languages.map(function (l) { return l.code; });
            const lang = detectLanguage();
            let finalLang = lang;
            if (!availableCodes.includes(finalLang) && finalLang) {
                const normalized = String(finalLang).split(/[-_]/)[0].toLowerCase();
                if (availableCodes.includes(normalized)) {
                    finalLang = normalized;
                }
            }
            if (!availableCodes.includes(finalLang)) {
                finalLang = availableCodes.includes('en') ? 'en' : (availableCodes[0] || 'en');
            }

            // Set HTML lang attribute for consistency
            document.documentElement.lang = finalLang;

            // Load English fallback when using non-English locale so missing keys in partial locales never render raw identifiers
            window.i18nFallback = {};
            if (finalLang !== 'en' && availableCodes.includes('en')) {
                try {
                    const fbXhr = new XMLHttpRequest();
                    fbXhr.open('GET', '/lang/en.json', false);
                    fbXhr.send();
                    if (fbXhr.status === 200) {
                        window.i18nFallback = JSON.parse(fbXhr.responseText);
                    }
                } catch (e) {
                    console.error('[i18n] Failed to load fallback translations:', e);
                }
            }

            // Load the appropriate language file
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/lang/' + finalLang + '.json', false);
            xhr.send();

            if (xhr.status === 200) {
                try {
                    window.i18n = JSON.parse(xhr.responseText);
                } catch (e) {
                    console.error('[i18n] Failed to parse JSON:', e);
                    window.i18n = window.i18nFallback || {};
                }
            } else {
                console.error('[i18n] Failed to load ' + finalLang + ' translations:', xhr.status);
                window.i18n = window.i18nFallback || {};
            }

            // Store detected language for future use
            window.gameapLang = finalLang;
        })();
    </script>
</head>
<body class="bg-app text-body font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
